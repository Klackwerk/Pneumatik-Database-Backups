# Test-profile datasource.
#
# Default: in-memory H2 — fast, no Docker needed.
#
# DB-compatibility runs (Testcontainers, requires Docker):
#   PNEUMATIK_TEST_DB=mariadb  ./gradlew integrationTest
#   PNEUMATIK_TEST_DB=postgres ./gradlew integrationTest
pneumatik:
  security:
    # fixed so the contract specs can sign in
    admin-password: admin

dataSource:
  dbCreate: create-drop
  driverClassName: '${PNEUMATIK_TEST_DB_DRIVER:org.h2.Driver}'
  username: '${PNEUMATIK_TEST_DB_USER:sa}'
  password: '${PNEUMATIK_TEST_DB_PASSWORD:}'
  url: '${PNEUMATIK_TEST_DB_URL:jdbc:h2:mem:testDb;MODE=MYSQL;LOCK_TIMEOUT=10000;DB_CLOSE_ON_EXIT=FALSE}'
